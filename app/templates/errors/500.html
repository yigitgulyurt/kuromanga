{% extends "base.html" %}

{% block title %}Sistem Hatası - Kuromanga{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-code">500</div>
        <h1 class="error-title">Bir Şeyler Ters Gitti!</h1>
        <p class="error-desc">
            Sunucumuz şu an bir "final boss" ile savaşıyor. 
            Teknik ekibimiz yardıma gitti bile. Lütfen biraz sonra tekrar dene.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('manga.manga_list') }}" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Ana Sayfaya Dön
            </a>
            <button onclick="location.reload()" class="btn btn-secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                Sayfayı Yenile
            </button>
        </div>
    </div>
</div>
{% endblock %}
