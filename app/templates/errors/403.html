{% extends "base.html" %}

{% block title %}Yetkisiz Erişim - Kuromanga{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-code">403</div>
        <h1 class="error-title">Giriş Engellendi</h1>
        <p class="error-desc">
            Bu bölgeye girmek için yeterli yetkin yok gibi görünüyor. 
            Belki de henüz yeterince seviye atlamamışsındır?
        </p>
        <div class="error-actions">
            <a href="{{ url_for('manga.manga_list') }}" class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Güvenli Bölgeye Dön
            </a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Giriş Yap
            </a>
        </div>
    </div>
</div>
{% endblock %}
